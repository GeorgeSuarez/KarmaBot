name: Production Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main commit or ref to validate for production"
        required: true
        default: "main"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify selected ref is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Build production image
        run: docker build --tag karmabot:${{ github.sha }} .
